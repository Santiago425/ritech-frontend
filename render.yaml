services:
  - type: web
    name: ritech-frontend
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Backend desplegado en Render (BACKEND-CACAO)
      - key: VITE_API_URL
        value: https://backend-ritech-f1oo.onrender.com
      - key: VITE_MODO_DEMO
        value: "false"
      # Contraseña de las cuentas de prueba (igual a SEED_PASSWORD del backend)
      - key: VITE_PASSWORD_PRUEBA
        value: 626588b636c79dd6116fe404f3e8ca43
    routes:
      # Las rutas de React Router (/envios, /envios/1...) se resuelven en el navegador.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
