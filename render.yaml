services:
  - type: web
    name: ritech-frontend
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Cuando el backend esté desplegado: poner su URL aquí y VITE_MODO_DEMO en false.
      - key: VITE_API_URL
        value: http://localhost:8080
      - key: VITE_MODO_DEMO
        value: "true"
    routes:
      # Las rutas de React Router (/envios, /envios/1...) se resuelven en el navegador.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
